site_name: Coletivo Mais Ciência
site_description: Pesquisadoras e pesquisadores do Programa Conhecimento Brasil em defesa da ciência, da educação e das políticas públicas.
site_url: https://SEU-USUARIO.github.io/coletivo-mais-ciencia/
copyright: Coletivo Mais Ciência · coletivomaisciencia@gmail.com

theme:
  name: material
  language: pt-BR
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Montserrat
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.top
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/coletivo_mais_ciencia/
      name: Instagram
    - icon: fontawesome/solid/envelope
      link: mailto:coletivomaisciencia@gmail.com
      name: E-mail

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition

nav:
  - Início: index.md
  - Posicionamentos:
      - posicionamentos/index.md
      - Manifesto (out. 2026): posicionamentos/manifesto-2026.md
  - Conhecimento Brasil: conhecimento-brasil.md
  - Faça parte: faca-parte.md
  - Imprensa: imprensa.md
  - Contato: contato.md
